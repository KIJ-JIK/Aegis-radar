name: Aegis Self-Healing Radar Cron

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-radar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run Aegis Pipeline & Self-Heal Loop
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_COLLECTOR_ID: ${{ secrets.BRIGHTDATA_COLLECTOR_ID || 'c_msymq29htvadbnxko' }}
          TARGET_URL: ${{ secrets.TARGET_URL || 'https://aws.amazon.com/new/' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node agents/pipeline.js || true

      - name: Commit State & Heal Log Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add sample-output/ data/state.json data/heal-logs.json || true
          git diff-index --quiet HEAD || git commit -m "chore(radar): automated dataset update & self-heal log [skip ci]"
          git push || true
